<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ下まで背景を伸ばし、UIは safe-area で内側に寄せる -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221f1c" media="(prefers-color-scheme: dark)" />
    <!-- ホーム画面に追加したときにブラウザUIを隠す -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS のホーム画面に出るアプリ名 -->
    <meta name="apple-mobile-web-app-title" content="まきこ" />

    <!--
      アイコンは public/icon.svg が原本。サイズ違いは `npm run icons` で書き出す。
      パスを相対にしてあるのは GitHub Pages のサブパス配信でも解決させるため。
    -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <!-- iOS は SVG も manifest のアイコンも見ないので、これが必須 -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>まきこのごきげん</title>
    <script type="module" crossorigin src="./assets/index-CmkF7Z3L.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-suVqJLcJ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
