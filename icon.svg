<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    ホーム画面用アイコン。まきこの顔。
    maskable(円形・角丸に切られる)前提で、顔は中央 80% の安全域に収めている。
  -->
  <rect width="512" height="512" fill="#f6efe4"/>

  <!--
    顔。半径150は 512 の約59%で、円形マスクでも切られない。
    あしの分だけ図形が下に伸びるので、全体を少し上に寄せて視覚的な中心を合わせる。
  -->
  <g transform="translate(256,240)">
    <!-- あし -->
    <ellipse cx="-86" cy="138" rx="21" ry="32" fill="#d8e8e4"/>
    <ellipse cx="86" cy="138" rx="21" ry="32" fill="#d8e8e4"/>

    <!-- あたま -->
    <circle cx="0" cy="0" r="150" fill="#d8e8e4"/>
    <!-- まきこの頭の一本線 -->
    <path d="M -136 -70 Q 0 -112 136 -70" stroke="#8fb5ac" stroke-width="12" fill="none"
          stroke-linecap="round"/>

    <!-- 目 -->
    <circle cx="-42" cy="4" r="13" fill="#3a3a3a"/>
    <circle cx="42" cy="4" r="13" fill="#3a3a3a"/>
    <!-- 口。しっかり者なので一本線 -->
    <path d="M -22 40 L 22 40" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round"/>
    <!-- ほお -->
    <ellipse cx="-74" cy="28" rx="20" ry="13" fill="#a9cfc6" opacity="0.75"/>
    <ellipse cx="74" cy="28" rx="20" ry="13" fill="#a9cfc6" opacity="0.75"/>
  </g>
</svg>
